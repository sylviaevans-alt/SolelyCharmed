<body>
    <header>
            <div class="promotion"><a href="#">Sign up to our email list for 20% off your first order!</a></div>
            <div class="logo-container">
    <h1 class="logo-text">
        <span>S</span><span>o</span><span>l</span><span>e</span><span>l</span><span>y</span><span>C</span><span>h</span><span>a</span><span>r</span><span>m</span><span>e</span><span>d</span>

    <div class="contact-form">
        <h2>Contact Me!</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
        </div>
    <footer>
        <h3 class="footer-info">Copyright 2026 | SolelyCharmed</h3>
    </footer>
</body>
